server:
  # 后端服务端口，前端 vite.config.js 中的代理目标需与此保持一致
  port: 8084

spring:
  datasource:
    # 数据库连接：库名 drone_manager，时区 Asia/Shanghai
    url: jdbc:mysql://localhost:3306/drone_manager?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 750925
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    # 日期序列化格式与时区，前端按此格式展示时间字段
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 各业务表均无 deleted 列，删除为物理删除；如需改为软删除需先补列并同步唯一键
      id-type: auto

jwt:
  # 令牌签名密钥（长度须满足 HMAC-SHA256 要求）与有效期（毫秒，86400000 即 24 小时）
  secret: DroneManagerSecretKeyForJWT20242025ThisIsAVeryLongSecretKeyThatMustBeAtLeast256BitsLong
  expiration: 86400000

app:
  battery:
    # 每增加一次循环，当前满充容量按标称容量的该比例衰减（0.0005 即 0.05%）
    decay-rate-per-cycle: 0.0005
    # 容量衰减下限，相对标称容量的比例（0.2 即不低于标称容量的 20%）
    min-capacity-ratio: 0.2

logging:
  level:
    com.drone: debug
